<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#14121f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bolt Run">
  <meta name="format-detection" content="telephone=no">
  <title>Bolt Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="logo">BOLT<span>RUN</span></h1>
      <div class="controls">
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3" height="12"/><rect x="10" y="2" width="3" height="12"/></svg>
        </button>
        <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute sound" aria-pressed="false">
          <svg class="ico-on" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z"/><rect x="11" y="5" width="1.6" height="6"/><rect x="13.4" y="3" width="1.6" height="10"/></svg>
          <svg class="ico-off" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M10.5 5.5l4 5M14.5 5.5l-4 5" stroke-width="1.8" stroke="currentColor" fill="none"/></svg>
        </button>
      </div>
    </header>

    <div id="stage" class="stage" role="application" aria-label="Bolt Run game. Press space or tap to jump.">
      <canvas id="game"></canvas>

      <div class="hud" aria-live="off">
        <span id="hiScore" class="hi">HI 00000</span>
        <span id="score" class="score">00000</span>
      </div>

      <div id="overlay" class="overlay">
        <p id="ovTitle" class="ov-title">READY?</p>
        <p id="ovBadge" class="ov-badge" hidden>NEW BEST!</p>
        <p id="ovSub" class="ov-sub">Press <kbd>Space</kbd> or tap to run</p>
        <button id="restartBtn" class="restart-btn" type="button" hidden aria-label="Restart">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 1 0 6 6h-2a4 4 0 1 1-4-4v3l4-4-4-4z"/></svg>
          <span>RETRY</span>
        </button>
      </div>
    </div>

    <p class="help">
      <span class="desk"><kbd>Space</kbd> <kbd>↑</kbd> or click — jump (hold = higher)</span>
      <span class="touch">Tap to jump — hold for a higher jump</span>
      <span><kbd>↓</kbd> fast-fall</span>
      <span><kbd>P</kbd> pause</span>
      <span><kbd>M</kbd> mute</span>
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
